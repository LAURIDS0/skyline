services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: skyline
      MARIADB_USER: skyline
      MARIADB_PASSWORD: ${DB_PASSWORD:-skyline}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-skyline-root}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: skyline
      DB_PASSWORD: ${DB_PASSWORD:-skyline}
      DB_NAME: skyline
      CARTO_KEY: ${CARTO_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  dbdata:
